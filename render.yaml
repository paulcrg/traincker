# Blueprint Render : un seul service (le mode démo a été retiré, le site
# principal traincker.app sert lui-même de vitrine publique, en lecture
# seule pour les trajets favoris — voir TRAINCKER_READONLY ci-dessous).
services:
  - type: web
    name: traincker
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: >
      streamlit run traincker/dashboard.py
      --server.port=$PORT --server.address=0.0.0.0
      --server.headless=true --server.enableCORS=false
      --server.enableXsrfProtection=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TRAINCKER_READONLY
        value: "1"
      - key: SNCF_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
