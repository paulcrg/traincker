# Blueprint Render : un seul service, désormais servi par traincker_web/
# (FastAPI + HTMX) au lieu du dashboard Streamlit. Le site public tourne
# en mode démo (TRAINCKER_DEMO) plutôt qu'en pure lecture seule : les
# visiteurs peuvent ajouter des trajets, mais avec des limites (5 trajets
# max, expiration automatique après 1h) — voir traincker_web/main.py.
services:
  - type: web
    name: traincker
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn traincker_web.main:app
      --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: TRAINCKER_DEMO
        value: "1"
      - key: SNCF_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
