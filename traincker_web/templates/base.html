<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traincker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="tk-blob tk-blob-1"></div>
    <div class="tk-blob tk-blob-2"></div>

    <div class="tk-logo-wrap">
        <img src="/static/assets/logo-white.png" alt="Traincker" style="height:46px;">
    </div>
    <p class="tk-caption">Suivi personnel des trains SNCF</p>

    <nav class="navbar">
        <a href="/" class="{{ 'active' if page == 'recherche' else '' }}">Recherche</a>
        <a href="/favoris" class="{{ 'active' if page == 'favoris' else '' }}">Favoris</a>
        <a href="/stats" class="{{ 'active' if page == 'stats' else '' }}">Statistiques</a>
        <a href="/apropos" class="{{ 'active' if page == 'apropos' else '' }}">En savoir plus</a>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}

        <div class="tk-footer">
            <span>© 2026 Traincker</span>
            <span class="tk-footer-sep">•</span>
            <span>Paul Crémoux Guiblain</span>
            <span class="tk-footer-sep">•</span>
            <span class="tk-footer-link">paulcrg</span>
        </div>
    </main>
</body>
</html>
