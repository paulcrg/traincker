name: Keep-alive Traincker

# Réveille périodiquement le dashboard principal pour éviter la mise en
# veille Render (15 min d'inactivité) et son démarrage à froid (30-60s).
#
# Limité à 7h-23h (heure française) : Render offre 750h d'instance
# gratuites par mois, PARTAGÉES entre tous tes services. Un ping 24h/24
# consommerait ~730h à lui seul et risquerait de dépasser le quota (donc
# une suspension complète en fin de mois). Sur une fenêtre de 16h/jour,
# ça reste largement sous le plafond, avec de la marge pour les vraies
# visites en dehors de cette fenêtre et pour le site de démo.
on:
  schedule:
    - cron: "*/10 5-21 * * *"  # 5h-21h UTC = 7h-23h heure française (été)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le dashboard
        run: 'curl -sS -o /dev/null -w "Statut HTTP: %{http_code}\n" https://traincker.app'
