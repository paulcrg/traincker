name: Keep-alive Traincker

# Réveille le dashboard pour éviter la mise en veille Render (15 min
# d'inactivité). Depuis la suppression du site de démo séparé, il n'y a
# plus qu'un seul service Render à alimenter : on peut donc élargir la
# fenêtre de ping. Render offre 750h d'instance gratuites par mois (un
# mois fait ~730h) ; on laisse volontairement une petite coupure nocturne
# (3h-5h du matin) comme marge de sécurité plutôt que de viser 24h/24 pile
# au plafond.
on:
  schedule:
    - cron: "*/10 5-23 * * *"   # 5h-23h UTC = 7h-1h heure française (été)
    - cron: "*/10 0-2 * * *"    # 0h-2h UTC = 2h-4h heure française (été)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le dashboard
        run: 'curl -sS -o /dev/null -w "Statut HTTP: %{http_code}\n" https://traincker.app'
